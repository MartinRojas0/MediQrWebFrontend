<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediQR - Portal del Paciente</title>
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/app-shell.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/citasDocumentos.css">
<link rel="stylesheet" href="css/views/inicio.css">
  <link rel="stylesheet" href="css/views/historial.css">
  <link rel="stylesheet" href="css/views/acceso.css">
</head>
<body>

  <!-- ENLACE PARA SALTAR AL CONTENIDO -->
  <!-- Sin esto, un usuario de teclado tiene que recorrer la barra de -->
  <!-- navegacion en cada vista antes de llegar al contenido.          -->
  <a class="skip-link" href="#app-main">Saltar al contenido</a>

  <!-- NAVBAR PRINCIPAL -->
<!-- Barra superior: marca. En movil cede el sitio a la barra inferior. -->
  <header class="app-bar">
    <a class="app-brand" data-action="nav:ir" data-ruta="inicio">
      <span class="app-brand-mark" aria-hidden="true"></span>
      <span class="app-brand-name">MediQR</span>
    </a>
    <div class="app-bar-crumb" aria-live="polite" id="app-crumb"></div>
  </header>

  <!-- Navegacion principal.
       Se comporta como barra inferior en celular, como riel lateral en
       tablet y como menu lateral completo en escritorio. Las cuatro
       secciones siguen la app movil; Documentos se conserva como seccion
       propia porque la web tambien lo ofrece. -->
  <nav class="app-nav" aria-label="Navegación principal">
    <a id="nav-inicio" class="nav-item" data-action="nav:ir" data-ruta="inicio">
      <span class="nav-item-icon"><i data-icon="home"></i></span>
      <span class="nav-item-label">Inicio</span>
    </a>
    <a id="nav-salud" class="nav-item" data-action="nav:ir" data-ruta="salud">
      <span class="nav-item-icon"><i data-icon="heart-pulse"></i></span>
      <span class="nav-item-label">Salud</span>
    </a>
    <a id="nav-citas" class="nav-item" data-action="nav:ir" data-ruta="citas">
      <span class="nav-item-icon"><i data-icon="calendar-days"></i></span>
      <span class="nav-item-label">Citas</span>
    </a>
    <a id="nav-documentos" class="nav-item" data-action="nav:ir" data-ruta="documentos">
      <span class="nav-item-icon"><i data-icon="folder-open"></i></span>
      <span class="nav-item-label">Documentos</span>
    </a>
    <a id="nav-perfil" class="nav-item" data-action="nav:ir" data-ruta="perfil">
      <span class="nav-item-icon"><i data-icon="user"></i></span>
      <span class="nav-item-label">Perfil</span>
    </a>
  </nav>

<main class="app-main" id="app-main" tabindex="-1">
    <div class="container">
    <section id="view-historial" class="view-section hidden"></section>

    <!-- ========================================== -->
    <!-- 1. VISTA: INICIO / DASHBOARD               -->
    <!-- ========================================== -->
    <section id="view-inicio" class="view-section">
    </section>

    <!-- SECCIÓN: CITAS (Calendario, Próximas, Historial y Agendar se dibujan desde js/citasDocumentos.js) -->
<section id="view-salud" class="view-section hidden">
    </section>

<section id="view-citas" class="view-section hidden">
      <div class="segmented" role="tablist" aria-label="Vistas de citas">
        <button type="button" role="tab" class="segmented-item" data-menu="citas" data-vista="calendario" data-action="citas:ir">Calendario</button>
        <button type="button" role="tab" class="segmented-item" data-menu="citas" data-vista="proximas" data-action="citas:ir">Próximas</button>
        <button type="button" role="tab" class="segmented-item" data-menu="citas" data-vista="historial" data-action="citas:ir">Historial</button>
        <button type="button" role="tab" class="segmented-item" data-menu="citas" data-vista="agendar" data-action="citas:ir">Agendar</button>
      </div>

      <p class="demo-note">
        Vista de demostración · Los cambios se mantienen
        mientras esta página esté abierta.
      </p>

      <div id="citas-content"></div>
    </section>

<!-- SECCIÓN: DOCUMENTOS (Todos, Recetas, Exámenes, Informes y Otros) -->
<section id="view-documentos" class="view-section hidden">
  <div class="module-heading">
    <div>
      <h1 id="doc-title">Mis documentos</h1>
      <p id="doc-subtitle" class="text-muted">
        Tus recetas, exámenes e informes en un solo lugar.
      </p>
    </div>

    <button
      class="btn btn-primary"
       data-action="documentos:form"
    >
      + Subir documento
    </button>
  </div>

<p class="demo-note">
        Vista de demostración · Los archivos seleccionados
        no se envían a un servidor.
      </p>

      <div class="segmented" role="tablist" aria-label="Tipos de documento">
        <button type="button" role="tab" class="segmented-item" data-menu="documentos" data-vista="Todos" data-action="documentos:ir">Todos</button>
        <button type="button" role="tab" class="segmented-item" data-menu="documentos" data-vista="Recetas" data-action="documentos:ir">Recetas</button>
        <button type="button" role="tab" class="segmented-item" data-menu="documentos" data-vista="Exámenes" data-action="documentos:ir">Exámenes</button>
        <button type="button" role="tab" class="segmented-item" data-menu="documentos" data-vista="Informes" data-action="documentos:ir">Informes</button>
        <button type="button" role="tab" class="segmented-item" data-menu="documentos" data-vista="Otros" data-action="documentos:ir">Otros</button>
      </div>

  <div class="document-filters">
    <label>
      Buscar documento
      <input
        id="doc-search"
        type="search"
        placeholder="Nombre, médico o especialidad"
         data-action="documentos:filtrar"
      >
    </label>

    <label id="doc-type-label">
      Tipo
      <select
        id="doc-type"
         data-action="documentos:filtrar"
      >
        <option>Todos</option>
        <option>Receta</option>
        <option>Examen</option>
        <option>Informe</option>
        <option>Otro</option>
      </select>
    </label>

    <label>
      Desde
      <input
        id="doc-from"
        type="date"
         data-action="documentos:filtrar"
      >
    </label>

    <label>
      Hasta
      <input
        id="doc-to"
        type="date"
         data-action="documentos:filtrar"
      >
    </label>
  </div>

  <p id="doc-count" class="text-muted"></p>

  <div
    id="documents-content"
    class="module-cards docs-grid"
  ></div>
</section>

    <!-- ========================================== -->
    <!-- 7. VISTA: PERFIL                           -->
    <!-- ========================================== -->
    <section id="view-perfil" class="view-section hidden">
    </section>

    <!-- ========================================== -->
    <!-- 8. ACCESO: INICIAR SESION / REGISTRO      -->
    <!-- ========================================== -->
    <!-- No cuelga de la barra: se llega desde      -->
    <!-- Perfil > Configuracion. No protege nada    -->
    <!-- porque no hay servidor; lo explica la propia -->
    <!-- pantalla.                                   -->
    <section id="view-acceso" class="view-section hidden">
    </section>

  </div>

  <!-- ========================================== -->
  <!-- VENTANA MODAL Y AVISOS                    -->
  <!-- ========================================== -->
<!-- VENTANA PARA FORMULARIOS Y DETALLES -->
        <dialog
          id="module-dialog"
          class="module-dialog"
          aria-labelledby="module-dialog-title"
        >
          <div class="module-heading">
            <h2 id="module-dialog-title"></h2>

            <button
              class="btn btn-outline"
              aria-label="Cerrar ventana"
               data-action="modal:cerrar"
            >
              ✕
            </button>
          </div>

          <div id="module-dialog-body"></div>
        </dialog>

        <!-- AVISOS DE CONFIRMACIÓN -->
        <div
          id="module-notice"
          class="module-notice hidden"
          role="status"
        ></div>

     <script src="js/icons.js"></script>
<script src="js/core/acciones.js"></script>
<script src="js/router.js"></script>
<script src="js/modules/inicio.js"></script>
<script src="js/modules/salud.js"></script>
<script src="js/modules/historial.js"></script>
<script src="js/modules/sos.js"></script>
<script src="js/modules/perfil.js"></script>
<script src="js/lib/validaciones.js"></script>
<script src="js/lib/dates.js"></script>
<script src="js/lib/dom.js"></script>
<script src="js/lib/format.js"></script>
<!-- acceso.js construye su marcado al cargar y usa MediPartes.dom.escapar,
     asi que tiene que venir despues de las librerias. -->
<script src="js/modules/acceso.js"></script>
<script src="js/components/navbar.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/modules/citas.js"></script>
<script src="js/modules/documentos.js"></script>
<script src="js/data/store.js"></script>
<script src="js/app.js"></script>
  </main>
</body>
</html>
