<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediQR - Portal del Paciente</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/citasDocumentos.css">
</head>
<body>

  <!-- NAVBAR PRINCIPAL -->
  <header class="navbar">
    <div class="nav-container">
      <div class="logo"><strong>MediQR</strong></div>
      <nav class="nav-links">
        <a id="nav-inicio" class="active" onclick="switchSection('inicio')">Inicio</a>
        <div class="nav-dropdown">
          <a id="nav-citas" class="nav-trigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false"
             onclick="MediModules.toggleMenu(event, this)">Citas ▾</a>
          <div class="nav-submenu">
            <div class="nav-submenu-list">
              <button type="button" data-menu="citas" data-vista="calendario" onclick="MediModules.irCitas('calendario')">Calendario</button>
              <button type="button" data-menu="citas" data-vista="proximas" onclick="MediModules.irCitas('proximas')">Próximas citas</button>
              <button type="button" data-menu="citas" data-vista="historial" onclick="MediModules.irCitas('historial')">Historial de citas</button>
              <button type="button" data-menu="citas" data-vista="agendar" onclick="MediModules.irCitas('agendar')">Agendar cita</button>
            </div>
          </div>
        </div>
        <div class="nav-dropdown">
          <a id="nav-documentos" class="nav-trigger" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false"
             onclick="MediModules.toggleMenu(event, this)">Documentos ▾</a>
          <div class="nav-submenu">
            <div class="nav-submenu-list">
              <button type="button" data-menu="documentos" data-vista="Todos" onclick="MediModules.irDocumentos('Todos')">Todos</button>
              <button type="button" data-menu="documentos" data-vista="Recetas" onclick="MediModules.irDocumentos('Recetas')">Recetas</button>
              <button type="button" data-menu="documentos" data-vista="Exámenes" onclick="MediModules.irDocumentos('Exámenes')">Exámenes</button>
              <button type="button" data-menu="documentos" data-vista="Informes" onclick="MediModules.irDocumentos('Informes')">Informes</button>
              <button type="button" data-menu="documentos" data-vista="Otros" onclick="MediModules.irDocumentos('Otros')">Otros</button>
            </div>
          </div>
        </div>
        <a id="nav-perfil" onclick="switchSection('perfil')">Perfil</a>
      </nav>
    </div>
  </header>

  <div class="container">

    <!-- ========================================== -->
    <!-- 1. VISTA: INICIO / DASHBOARD               -->
    <!-- ========================================== -->
    <section id="view-inicio" class="view-section">
    </section>

    <!-- SECCIÓN: CITAS (Calendario, Próximas, Historial y Agendar se dibujan desde js/citasDocumentos.js) -->
<section id="view-citas" class="view-section hidden">
  <p class="demo-note">
    Vista de demostración · Los cambios se mantienen
    mientras esta página esté abierta.
  </p>

  <div id="citas-content"></div>
</section>

<!-- SECCIÓN: DOCUMENTOS (Todos, Recetas, Exámenes, Informes y Otros) -->
<section id="view-documentos" class="view-section hidden">
  <div class="module-heading">
    <div>
      <h1 id="doc-title">Mis documentos</h1>
      <p id="doc-subtitle" class="text-muted">
        Tus recetas, exámenes e informes en un solo lugar.
      </p>
    </div>

    <button
      class="btn btn-primary"
      onclick="MediModules.documentForm()"
    >
      + Subir documento
    </button>
  </div>

  <p class="demo-note">
    Vista de demostración · Los archivos seleccionados
    no se envían a un servidor.
  </p>

  <div class="document-filters">
    <label>
      Buscar documento
      <input
        id="doc-search"
        type="search"
        placeholder="Nombre, médico o especialidad"
        oninput="MediModules.documents()"
      >
    </label>

    <label id="doc-type-label">
      Tipo
      <select
        id="doc-type"
        onchange="MediModules.documents()"
      >
        <option>Todos</option>
        <option>Receta</option>
        <option>Examen</option>
        <option>Informe</option>
        <option>Otro</option>
      </select>
    </label>

    <label>
      Desde
      <input
        id="doc-from"
        type="date"
        onchange="MediModules.documents()"
      >
    </label>

    <label>
      Hasta
      <input
        id="doc-to"
        type="date"
        onchange="MediModules.documents()"
      >
    </label>
  </div>

  <p id="doc-count" class="text-muted"></p>

  <div
    id="documents-content"
    class="module-cards docs-grid"
  ></div>
</section>

    <!-- ========================================== -->
    <!-- 7. VISTA: PERFIL                           -->
    <!-- ========================================== -->
    <section id="view-perfil" class="view-section hidden">
    </section>

  </div>

  <!-- ========================================== -->
  <!-- VENTANA MODAL Y AVISOS                    -->
  <!-- ========================================== -->
<!-- VENTANA PARA FORMULARIOS Y DETALLES -->
        <dialog
          id="module-dialog"
          class="module-dialog"
          aria-labelledby="module-dialog-title"
        >
          <div class="module-heading">
            <h2 id="module-dialog-title"></h2>

            <button
              class="btn btn-outline"
              aria-label="Cerrar ventana"
              onclick="MediModules.close()"
            >
              ✕
            </button>
          </div>

          <div id="module-dialog-body"></div>
        </dialog>

        <!-- AVISOS DE CONFIRMACIÓN -->
        <div
          id="module-notice"
          class="module-notice hidden"
          role="status"
        ></div>

     <script src="js/icons.js"></script>
<script src="js/router.js"></script>
<script src="js/modules/inicio.js"></script>
<script src="js/modules/perfil.js"></script>
     <script src="js/citasDocumentos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
